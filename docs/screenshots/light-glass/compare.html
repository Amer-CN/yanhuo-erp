<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻玻璃精修 · 前后对照</title><style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#0b151c;color:#eef3f5}body{max-width:1100px;margin:0 auto;padding:28px 20px 64px}h1{font-size:28px;margin:0 0 12px}p{line-height:1.7;color:#c0ccd2}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:10px 16px;background:#20333f;color:inherit;border:1px solid #52616a;border-radius:10px;cursor:pointer}button[aria-pressed=true]{background:#ff8a00;color:#2a1600;border-color:#ff8a00}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption{font-weight:600;font-size:18px;margin:0 0 12px}img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid #3e4e58}a{color:#ffbb6b}@media(max-width:620px){body{padding:20px 10px}main{gap:8px}h1{font-size:23px}figcaption{font-size:15px}}</style></head><body>
<h1>轻玻璃精修 · A 方案</h1><p>保留烟花橙与深浅主题，收淡背景光、卡片高光和次要按钮；本场金额更突出，流水金额右对齐。截图使用隔离测试数据，前后对应相同操作流程。</p>
<nav aria-label="选择对照页面"><button data-view="01-record-dark" aria-pressed="true">记账 · 深色</button><button data-view="02-stock-dark" aria-pressed="false">库存</button><button data-view="03-report-dark" aria-pressed="false">报表</button><button data-view="04-purchase-dark" aria-pressed="false">进货</button><button data-view="05-settings-dark" aria-pressed="false">设置</button><button data-view="06-picker-dark" aria-pressed="false">选商品</button><button data-view="07-editor-dark" aria-pressed="false">开单</button><button data-view="08-record-light" aria-pressed="false">记账 · 浅色</button><button data-view="09-stock-light" aria-pressed="false">库存 · 浅色</button></nav>
<main><figure><figcaption>改前</figcaption><img id="before" src="before/01-record-dark.png" alt="改前页面截图"></figure><figure><figcaption>精修后</figcaption><img id="after" src="final/01-record-dark.png" alt="精修后页面截图"></figure></main>
<script>for(const b of document.querySelectorAll('button[data-view]'))b.addEventListener('click',()=>{for(const o of document.querySelectorAll('button[data-view]'))o.setAttribute('aria-pressed',String(o===b));document.getElementById('before').src='before/'+b.dataset.view+'.png';document.getElementById('after').src='final/'+b.dataset.view+'.png'})</script>
</body></html>
