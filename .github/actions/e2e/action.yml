name: E2E
description: 安装 Python/Playwright、启动 dev(5173) 与 preview(4173)、跑四个 E2E

inputs:
  node-version:
    description: Node 版本
    default: "22"
  pnpm-version:
    description: pnpm 版本
    default: "12"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r scripts/requirements.txt

        # runner 偶发 DNS 抖动（azure.archive.ubuntu.com 解析失败）会让 apt 直接 100 退出，
        # 进而使 playwright --with-deps 失败。先带重试预热系统字体依赖，减少一次抖动就整步失败的概率。
        # 注：composite action 不支持 step 级 timeout-minutes，超时保护只能靠 job 级设置。
        for i in 1 2 3; do
          if sudo apt-get update -o Acquire::Retries=5 \
            && sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei; then
            echo "apt 系统依赖就绪（第 $i 次尝试）"
            break
          fi
          echo "apt-get 失败，第 $i 次，等 15 秒重试"
          sleep 15
        done

        # playwright 安装同样重试：--with-deps 内部仍会跑 apt，DNS 抖动时需要整体重来。
        for i in 1 2 3; do
          if python -m playwright install --with-deps chromium; then
            break
          fi
          echo "playwright install 失败，第 $i 次，等 15 秒重试"
          sleep 15
        done
        # 最后再确认一次：仍失败则整个步骤失败，避免门禁被静默跳过。
        python -m playwright install --with-deps chromium

    - name: Build
      shell: bash
      run: pnpm build

    - name: Start dev server (5173)
      shell: bash
      run: |
        nohup pnpm exec vite --host 127.0.0.1 --port 5173 > /tmp/dev.log 2>&1 &
        echo $! > /tmp/dev.pid
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
          sleep 1
        done
        echo 'dev server failed to start'
        cat /tmp/dev.log
        exit 1

    - name: Start preview server (4173)
      shell: bash
      run: |
        nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
        echo $! > /tmp/preview.pid
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
          sleep 1
        done
        echo 'preview server failed to start'
        cat /tmp/preview.log
        exit 1

    - name: check default sync (zero-config)
      shell: bash
      run: python scripts/check-default-sync.py

    - name: e2e smoke
      shell: bash
      run: python scripts/e2e-smoke.py

    - name: e2e sync (mock Supabase)
      shell: bash
      run: python scripts/e2e-sync.py

    - name: e2e offline (preview + service worker)
      shell: bash
      run: python scripts/e2e-offline.py

    # 依赖前面已启动的 dev server（http://127.0.0.1:5173/，a11y-check.py 的默认 BASE，不传参即用它）。
    # TODO(2026-11-10 起观察期)：稳定两周后去掉 continue-on-error，转为正式门禁。
    - name: 无障碍回归（观察期，不阻塞部署）
      continue-on-error: true
      shell: bash
      run: python scripts/a11y-check.py

    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-screenshots
        path: docs/screenshots/e2e/
        if-no-files-found: ignore

    - name: Server logs
      if: failure()
      shell: bash
      run: |
        echo '--- dev server ---'
        cat /tmp/dev.log || true
        echo '--- preview server ---'
        cat /tmp/preview.log || true
