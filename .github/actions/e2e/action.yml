name: E2E
description: 安装 Python/Playwright、启动 dev(5173) 与 preview(4173)、跑四个 E2E

inputs:
  node-version:
    description: Node 版本
    default: "22"
  pnpm-version:
    description: pnpm 版本
    default: "12"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r scripts/requirements.txt

        # 中文字体只影响截图渲染，装不上不阻塞（断言基于 DOM 文本）。
        # 单独装、只试一次，避免 apt 抖动拖垮整个 job（job 级上限 20 分钟）。
        sudo apt-get update -o Acquire::Retries=2 || true
        sudo apt-get install -y --no-install-recommends fonts-noto-cjk || echo "中文字体未装上，继续（不影响断言）"

        # 关键：不传「连系统依赖一起装」的开关。ubuntu-latest 已预装 Chromium 所需的库，
        # 传了会跑 apt 全量安装，runner DNS 抖动时会卡 10 分钟并击穿 job 超时。
        for i in 1 2 3; do
          if python -m playwright install chromium; then
            break
          fi
          echo "playwright 安装失败，第 $i 次，等 10 秒重试"
          sleep 10
        done
        python -m playwright install chromium

    - name: Build
      shell: bash
      run: pnpm build

    - name: Start dev server (5173)
      shell: bash
      run: |
        nohup pnpm exec vite --host 127.0.0.1 --port 5173 > /tmp/dev.log 2>&1 &
        echo $! > /tmp/dev.pid
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
          sleep 1
        done
        echo 'dev server failed to start'
        cat /tmp/dev.log
        exit 1

    - name: Start preview server (4173)
      shell: bash
      run: |
        nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
        echo $! > /tmp/preview.pid
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
          sleep 1
        done
        echo 'preview server failed to start'
        cat /tmp/preview.log
        exit 1

    - name: check default sync (zero-config)
      shell: bash
      run: python scripts/check-default-sync.py

    - name: e2e smoke
      shell: bash
      run: python scripts/e2e-smoke.py

    - name: e2e sync (mock Supabase)
      shell: bash
      run: python scripts/e2e-sync.py

    - name: e2e offline (preview + service worker)
      shell: bash
      run: python scripts/e2e-offline.py

    # 依赖前面已启动的 dev server（http://127.0.0.1:5173/，a11y-check.py 的默认 BASE，不传参即用它）。
    # TODO(2026-11-10 起观察期)：稳定两周后去掉 continue-on-error，转为正式门禁。
    - name: 无障碍回归（观察期，不阻塞部署）
      continue-on-error: true
      shell: bash
      run: python scripts/a11y-check.py

    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-screenshots
        path: docs/screenshots/e2e/
        if-no-files-found: ignore

    - name: Server logs
      if: failure()
      shell: bash
      run: |
        echo '--- dev server ---'
        cat /tmp/dev.log || true
        echo '--- preview server ---'
        cat /tmp/preview.log || true
