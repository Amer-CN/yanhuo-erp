name: E2E

# push 到 main 时由 deploy.yml 的 e2e job 做门禁（build.needs: e2e），
# 这里只跑 PR 与手动触发，避免同一次 push 重复跑两遍 E2E。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 与 deploy.yml 一致：为 Playwright 安装的 apt 重试留出预算。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/e2e
